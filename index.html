<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Never-Ending Dungeon Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Never-Ending Dungeon Explorer</h1>
        <p>Procedurally generated dungeons, 2 warps each, smart monsters, and player progression.</p>
      </header>

      <section class="stats" id="player-stats"></section>

      <section class="dungeon" id="dungeon-card"></section>

      <section class="actions">
        <button id="step-btn">Advance Turn</button>
        <button id="warp-a-btn">Use Warp A</button>
        <button id="warp-b-btn">Use Warp B</button>
      </section>

      <section>
        <h2>Combat Log</h2>
        <ul id="log"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
