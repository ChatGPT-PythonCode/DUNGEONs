<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Never-Ending Dungeon Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Never-Ending Dungeon Explorer</h1>
        <p>Top-down procedural dungeon crawler. Move with <strong>WASD / Arrow Keys</strong>.</p>
      </header>

      <section class="layout">
        <article class="panel map-panel">
          <canvas id="game-canvas" width="576" height="576" aria-label="Dungeon map"></canvas>
          <div class="controls">
            <button id="up-btn">↑</button>
            <div>
              <button id="left-btn">←</button>
              <button id="down-btn">↓</button>
              <button id="right-btn">→</button>
            </div>
          </div>
        </article>

        <article class="panel info-panel">
          <section id="player-stats"></section>
          <section id="dungeon-card"></section>
          <section>
            <h2>Combat Log</h2>
            <ul id="log"></ul>
          </section>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
